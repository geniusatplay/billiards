name: iPhone build

# Builds Emerald Online 8 Ball Pool AR for iPhone / iPad on a GitHub Mac: the ARKit plugin, the Godot export, the Xcode build.
# The result is an unsigned .ipa, published as the "ios-latest" release, for installing with Sideloadly, and (once the
# signing secrets are in the repo) the same app signed for the App Store and sent to TestFlight.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulator_check:
        description: "Also run the game's ios_check test on an iPhone simulator (slow: no GPU in the cloud)"
        type: boolean
        default: false
      store:
        description: "The store version (no debug menu, no developer options), published as ios-store-latest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    # Godot 4.7.2's iOS engine library is built with Xcode 26 (iOS 26 SDK), so the app must be linked with it too
    runs-on: macos-26
    timeout-minutes: 75
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 and SCons
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -version | grep -q "^Xcode 26" || { echo "Godot 4.7.2 needs Xcode 26 to link the app"; exit 1; }
          python3 -m pip install --user --break-system-packages scons || brew install scons
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: godot-cpp (cached between builds)
        uses: actions/cache@v4
        with:
          path: ios_plugin/godot-cpp
          key: godot-cpp-4.5-ios-arm64-sim2-min15-xcode26-v3

      - name: Build the ARKit plugin
        run: bash ios_plugin/ci.sh plugin

      - name: Godot 4.7.2 + iOS template (cached between builds)
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-macos-ios-template-v1

      - name: Get Godot
        run: bash ios_plugin/ci.sh godot

      - name: Export the Xcode project
        env:
          EB_STORE: ${{ (github.event_name == 'workflow_dispatch' && inputs.store) && '1' || '' }}
        run: bash ios_plugin/ci.sh export

      - name: Build the app (unsigned .ipa)
        run: bash ios_plugin/ci.sh ipa

      - name: Keep the Xcode log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/ios/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish as the "ios-latest" release (the store version as "ios-store-latest")
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.store) && 'ios-store-latest' || 'ios-latest' }}
          KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.store) && 'store version, ' || '' }}
        run: |
          IPA=$(ls build/ios/EmeraldBreak-*.ipa)
          VER=$(basename "$IPA" .ipa | sed 's/EmeraldBreak-//')
          cp "$IPA" build/ios/EmeraldBreak.ipa
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$IPA" build/ios/EmeraldBreak.ipa \
            --target "$GITHUB_SHA" --prerelease \
            --title "Emerald 8 Ball Pool $VER for iPhone (${KIND}unsigned, for Sideloadly)" \
            --notes "Built from ${GITHUB_SHA::7}. Install with Sideloadly: drag EmeraldBreak.ipa in, sign in with your Apple ID, Start. With a free Apple ID the app runs for 7 days, then install it again."

      - name: Sign and send to TestFlight (once the repo has the signing secrets)
        # 26 Nov 2026: the "Testers" group in App Store Connect gets every build. Skips itself until the repo has the
        # secrets ASC_KEY_P8 (keys\AuthKey_2CAD29DLAB.p8) and IOS_DIST_KEY (keys\ios_distribution_key.pem)
        # (Settings > Secrets and variables > Actions).
        env:
          ASC_KEY_ID: "2CAD29DLAB"          # App Store Connect API key "Emerald 8 Ball Pool CI" (not secret on its own)
          ASC_ISSUER_ID: "530c1faa-a59e-4a14-a33a-8adaa953e2db"
          ASC_APP_ID: "6839666893"
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_KEY: ${{ secrets.IOS_DIST_KEY }}
        run: bash ios_plugin/ci.sh testflight

      - name: Test on an iPhone simulator (plugin, safe area, AR start-up)
        # off unless started by hand (Actions -> iPhone build -> Run workflow -> tick the box): it's slow
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulator_check }}
        # informative: the .ipa above is already published; a slow simulator must not mark the build failed
        continue-on-error: true
        timeout-minutes: 40
        run: bash ios_plugin/ci.sh sim

      - name: Publish the simulator results as the "ios-sim-check" release
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.simulator_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls build/ios/sim/ 2>/dev/null || exit 0
          gh release delete ios-sim-check --yes --cleanup-tag || true
          gh release create ios-sim-check build/ios/sim/* --target "$GITHUB_SHA" --prerelease \
            --title "iPhone simulator check (${GITHUB_SHA::7})" \
            --notes "Pictures and log of the game's ios_check test on an iPhone simulator. The simulator has no AR camera, so AR stops with the Apple ARKit message there; on a real iPhone the table is placed in the room."
