 את שולחן הביליארד בחדר שלך (AR).", "ur": "Emerald Break کیمرہ استعمال کرتا ہے تاکہ پول ٹیبل آپ کے کمرے میں رکھی جا سکے (AR)۔", "hi": "Emerald Break पूल टेबल को आपके कमरे में रखने के लिए कैमरे का इस्तेमाल करता है (AR)।", "mr": "पूल टेबल तुमच्या खोलीत ठेवण्यासाठी Emerald Break कॅमेरा वापरते (AR).", "bn": "পুল টেবিলটি আপনার ঘরে বসাতে Emerald Break ক্যামেরা ব্যবহার করে (AR)।", "pa": "Emerald Break ਪੂਲ ਟੇਬਲ ਨੂੰ ਤੁਹਾਡੇ ਕਮਰੇ ਵਿੱਚ ਰੱਖਣ ਲਈ ਕੈਮਰਾ ਵਰਤਦਾ ਹੈ (AR)।", "ta": "பூல் மேசையை உங்கள் அறையில் வைக்க Emerald Break கேமராவைப் பயன்படுத்துகிறது (AR).", "te": "పూల్ టేబుల్‌ను మీ గదిలో ఉంచడానికి Emerald Break కెమెరాను వాడుతుంది (AR)."}
