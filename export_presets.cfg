", "ar": "يستخدم Emerald 8 Ball Pool الكاميرا لوضع طاولة البلياردو في غرفتك (الواقع المعزز).", "he": "Emerald 8 Ball Pool משתמש במצלמה כדי להציב את שולחן הביליארד בחדר שלך (AR).", "ur": "Emerald 8 Ball Pool کیمرہ استعمال کرتا ہے تاکہ پول ٹیبل آپ کے کمرے میں رکھی جا سکے (AR)۔", "hi": "Emerald 8 Ball Pool पूल टेबल को आपके कमरे में रखने के लिए कैमरे का इस्तेमाल करता है (AR)।", "mr": "पूल टेबल तुमच्या खोलीत ठेवण्यासाठी Emerald 8 Ball Pool कॅमेरा वापरते (AR).", "bn": "পুল টেবিলটি আপনার ঘরে বসাতে Emerald 8 Ball Pool ক্যামেরা ব্যবহার করে (AR)।", "pa": "Emerald 8 Ball Pool ਪੂਲ ਟੇਬਲ ਨੂੰ ਤੁਹਾਡੇ ਕਮਰੇ ਵਿੱਚ ਰੱਖਣ ਲਈ ਕੈਮਰਾ ਵਰਤਦਾ ਹੈ (AR)।", "ta": "பூல் மேசையை உங்கள் அறையில் வைக்க Emerald 8 Ball Pool கேமராவைப் பயன்படுத்துகிறது (AR).", "te": "పూల్ టేబుల్‌ను మీ గదిలో ఉంచడానికి Emerald 8 Ball Pool కెమెరాను వాడుతుంది (AR)."}
